apiVersion: apps/v1
kind: Deployment
metadata:
  name: onlineshop-deply
  namespace: onlineshop-app
  labels:
    app: online-shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: online-shop
  template:
    metadata:
      labels:
        app: online-shop
    spec:
      containers:
      - name: onlineshop-pod
        image: ssarovar6/online-shop:01499473b449ba78d40d14f5f1eecd9584c2aae9
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: online-shop-config
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "300m"
            memory: "256Mi"
