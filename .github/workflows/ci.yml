name: CI

on:
  workflow_call:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # validate backend dockerfile
      - name: validate Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with: 
          dockerfile: ./Dockerfile
          ignore: DL3018 
        

      - uses: docker/setup-buildx-action@v4
      # build image
      - name: Build Docker Image
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/online-shop:${{ github.sha }} .
          fi
    
      # image scan
      - name: Trivy Scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/online-shop:${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit code: '1'
          trivyignore: ${{ github.workspace }}/.trivyignore
      
      # login and push image 
      - name: Login to DockerHub
        uses: docker/login-action@v3
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tag & push scanned image to dockerhub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/online-shop:${{ github.sha }}
          