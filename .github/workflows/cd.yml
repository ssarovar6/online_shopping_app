name: CD

on:
  workflow_call:

env:
  CLUSTER: shopping-cluster
  NAMESPACE: onlineshop-app
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  EC2_HOST: ${{ secrets.EC2_HOST }}

jobs:
  update-manifests:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Pin images to commit SHA
        env:
          SHA: ${{ github.sha }}
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "$DOCKER_USER" ]; then
            echo "ERROR: DOCKERHUB_USERNAME secret is not set."
            exit 1
          fi
          sed -i "s|image: ${DOCKER_USER}/online-shop:.*|image: ${DOCKER_USER}/online-shop:${SHA}|"  k8s/deployment.yml
      
      - name: Commit + push if changed
        env:
          SHA: ${{ github.sha }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Manifests already pinned to ${SHA}; nothing to commit."
            exit 0
          fi
          git add k8s/deployment.yaml
          git commit -m "deploy: pin docker-image version to ${SHA:0:7}"
          git push

  deploy:
    needs: [update-manifests]
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:    
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: CLUSTER,NAMESPACE,DOCKERHUB_USERNAME
          script: |
            set -e # Exit immediately if any command fails
            echo "Install required package"
            sudo apt update -y
            sudo apt install docker.io -y
            sudo apt install docker-compose-v2 -y
            sudo usermod -aG docker $USER 
            newgrp docker

            # Ensure kubectl is installed on the target machine
            if ! command -v kubectl &> /dev/null; then
              echo "Installing kubectl binary directly..."
              curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
              curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl.sha256"
              echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
              sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
              # Clean up temporary verification files to keep the workspace immaculate
              rm -f kubectl kubectl.sha256
              kubectl version --client
            fi

            # ensure kind is installed
            if ! command -v kind &> /dev/null; then
              echo "Downloading and installing Kind..."
              [ $(uname -m) = x86_64 ] && curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-amd64
              chmod +x ./kind
              sudo mv ./kind /usr/local/bin/kind
              kind version
            fi

            # Fetch updated manifests
            if [ ! -d ~/online_shopping_app ]; then
              git clone ${{ github.server_url }}/${{ github.repository }}.git ~/online_shopping_app
            fi
            cd ~/online_shopping_app
            git pull origin master

            # GENERATE THE .ENV FILE
            echo "DOCKERHUB_USERNAME=$DOCKERHUB_USERNAME" > .env 

            if [ ! -f .env ]; then
              echo "ERROR: ~/online_shopping_app/.env is missing. Create it once with DOCKERHUB_USERNAME."
              exit 1
            fi
            
            # Create a cluster ' if none exist
            if ! kind get clusters | grep -q "^${CLUSTER}$"; then
              echo "No active Kind cluster found. Creating one..."
              kind create cluster --config k8s/kind-cluster.yaml --name "${CLUSTER}"
            fi

            # cretae namespace 
            kubectl apply -f k8s/namespace.yml


            # Deploying to Kind Cluster
            echo "==== 5. Deploying to Cluster ===="
            kubectl apply -f k8s/deployment.yml
          

            echo "==== 6. Verifying Service Rollouts ===="
            kubectl rollout status deployment/onlineshop-deply   -n "${NAMESPACE}" --timeout=120s

            # Open below Links to open APP 
            echo "===================================================================="
            echo " DEPLOYMENT SUCCESSFUL!"
            echo "Open URL http://${{ secrets.EC2_HOST }}:80 to access your application"
            echo "===================================================================="
