name: CI-CD Pipeline
on:
  workflow_dispatch:
  
jobs:
  # code-qyuality:
  #   uses: ./.github/workflows/code-quality.yml
  secret-scan:
    uses: ./.github/workflows/secret-scan.yml
    secrets: inherit
  build-job:
    needs: [secret-scan]
    uses: ./.github/workflows/ci.yml
    secrets: inherit
  deploy-app-job:
    needs: [build-job]
    uses: ./.github/workflows/cd-.yml
    secrets: inherit
    permissions:
      contents: write